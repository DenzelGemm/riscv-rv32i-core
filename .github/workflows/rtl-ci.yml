name: RV32I RTL CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  rtl-sim:
    name: Compile and run RTL tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install open-source simulator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog

      - name: Compile and run unit tests
        run: |
          mkdir -p build

          iverilog -g2012 -s tb_alu -o build/tb_alu.vvp \
            rtl/core/*.sv rtl/mem/*.sv rtl/top/*.sv tb/tb_alu.sv
          timeout 2m vvp build/tb_alu.vvp

          iverilog -g2012 -s tb_lsu -o build/tb_lsu.vvp \
            rtl/core/*.sv rtl/mem/*.sv rtl/top/*.sv tb/tb_lsu.sv
          timeout 2m vvp build/tb_lsu.vvp

          iverilog -g2012 -s tb_regfile -o build/tb_regfile.vvp \
            rtl/core/*.sv rtl/mem/*.sv rtl/top/*.sv tb/tb_regfile.sv
          timeout 2m vvp build/tb_regfile.vvp

      - name: Compile and run top-level integration test
        run: |
          mkdir -p build
          cd quartus/simulation/questa
          iverilog -g2012 -s tb_rv32i_single_top \
            -o ../../../build/tb_rv32i_single_top.vvp \
            ../../../rtl/core/*.sv ../../../rtl/mem/*.sv \
            ../../../rtl/top/*.sv ../../../tb/tb_rv32i_single_top.sv
          timeout 2m vvp ../../../build/tb_rv32i_single_top.vvp
